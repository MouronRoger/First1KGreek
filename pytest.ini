[pytest]
testpaths = tests
python_files = test_*.py
python_classes = *Tests
python_functions = test_*
markers =
    unit: Unit tests
    integration: Integration tests
    performance: Performance tests
    api: API tests for FastAPI implementation
    http: Tests for HTTP server
    hybrid: Tests for hybrid server mode
    client: Tests for JavaScript API client
addopts = -xvs
log_cli = True
log_cli_level = INFO 