name: Auto Format Files

on:
  schedule:
    # Run every Monday at 3:00 AM
    - cron: '0 3 * * 1'
  workflow_dispatch:
    # Allow manual triggering

jobs:
  format-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r tools/linting/requirements-lint.txt

      - name: Identify non-compliant files
        id: identify
        run: |
          python -c "
          import json
          import random

          # Read the progress file
          with open('lint_reports/progress.json', 'r') as f:
              progress = json.load(f)

          # Get files that don't comply with black or flake8
          non_compliant = []
          for file, status in progress.get('non_compliant_files', {}).items():
              if not status.get('black') or not status.get('flake8'):
                  non_compliant.append(file)

          # Pick 3-5 files to format (or all if fewer)
          num_files = min(random.randint(3, 5), len(non_compliant))
          files_to_format = random.sample(non_compliant, num_files) if non_compliant else []

          # Output the list of files
          with open(env.GITHUB_OUTPUT, 'a') as f:
              f.write(f'files_to_format={json.dumps(files_to_format)}')
              f.write(f'file_count={len(files_to_format)}')

          # Print files to be formatted
          print(f'Files to format: {files_to_format}')
          "

      - name: Format selected files
        if: steps.identify.outputs.file_count > 0
        run: |
          FILES=$(echo '${{ steps.identify.outputs.files_to_format }}' | jq -r '.[]')
          for file in $FILES; do
            echo "Formatting $file"
            python tools/linting/format_incremental.py "$file"
          done

      - name: Create Pull Request
        if: steps.identify.outputs.file_count > 0
        uses: peter-evans/create-pull-request@v5
        with:
          commit-message: "Auto-format files via weekly job"
          title: "Weekly Auto-Formatting"
          body: |
            This PR contains automated formatting changes for the following files:

            ```
            ${{ steps.identify.outputs.files_to_format }}
            ```

            Changes applied:
            - Black code formatting
            - isort import sorting
            - Flake8 fixes (where possible)

            This is an automated PR created by the weekly auto-format GitHub Action.
          branch: auto-format-weekly
          delete-branch: true
